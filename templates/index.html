<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>束流数据智能分析系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-atom"></i>
                </div>
                <span class="logo-title">束流数据智能分析系统</span>
            </div>
            <div class="header-meta">
                <span class="status-badge">
                    <span class="status-dot"></span>
                    <span>系统就绪</span>
                </span>
                <span id="data-info" class="data-info-pill">加载中...</span>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="chat-container">
            <div class="chat-messages" id="chat-messages">
                <div class="welcome-card">
                    <div class="welcome-icon">
                        <i class="fas fa-atom"></i>
                    </div>
                    <h2>束流数据分析助手</h2>
                    <p>您可以用自然语言查询和分析束流数据，例如：</p>
                    <div class="welcome-chips">
                        <span class="chip">查询8月31日两点到三点的束流数据</span>
                        <span class="chip">检测该时段是否存在异常</span>
                        <span class="chip">用SHAP方法诊断异常特征</span>
                        <span class="chip">feature6 是什么意思？</span>
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="input-wrapper">
                    <textarea
                        id="chat-input"
                        placeholder="输入您的问题，Enter 发送，Shift+Enter 换行..."
                        rows="1"
                    ></textarea>
                    <button id="send-btn" class="send-btn" title="发送 (Enter)">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="input-footer">
                    <button id="reset-btn" class="reset-btn">
                        <i class="fas fa-rotate-left"></i>清空对话
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div id="notification-container" class="notification-container"></div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
